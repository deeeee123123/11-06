<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常｜個人行程與任務</title><style>
:root{--ink:#253229;--green:#315e48;--muted:#849087;--line:#e9ede8;--bg:#f7f8f6;--soft:#edf3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1400px;margin:auto;padding:24px 30px}.top{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-weight:700;font-size:17px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--green);color:white;border-radius:11px;margin-right:9px}.profile{background:white;border:1px solid var(--line);padding:8px 12px;border-radius:11px;color:#536055}.layout{display:grid;grid-template-columns:210px 1fr;gap:25px}.sidebar{padding-top:8px;color:#647067}.side-title{font-size:10px;letter-spacing:1.2px;color:#a0a79f;margin:0 0 12px 10px;font-weight:bold}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;color:inherit;border-radius:9px;padding:11px 12px}.nav button.active{background:#e8efe9;color:var(--green);font-weight:650}.nav button span{display:inline-block;width:25px}.sidegroup{margin-top:30px}.cat{padding:5px 10px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:3px;background:#88a58d;margin-right:9px}.cat:nth-child(3) .dot{background:#d0a75e}.cat:nth-child(4) .dot{background:#8297b8}.cat:nth-child(5) .dot{background:#cf827d}.linebox{margin-top:28px;background:white;border:1px solid var(--line);padding:14px;border-radius:12px;font-size:12px}.linebox p{color:var(--muted);font-size:11px}.linebox button{border:0;background:var(--soft);color:var(--green);padding:8px;border-radius:7px;font-size:11px}.main{min-width:0}.greeting{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eyebrow{font-size:11px;color:#8a958b;margin-bottom:5px}.greeting h1{font-size:26px;margin:0;letter-spacing:-.5px}.greeting h1 em{font-style:normal;color:#9eae99}.date{text-align:right;color:#79847a;font-size:11px}.date b{display:block;color:#354238;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{padding:13px 15px;background:white;border:1px solid var(--line);border-radius:13px}.stat label{font-size:11px;color:#808b81}.stat strong{display:block;font-size:24px;margin-top:5px}.stat small{font-size:10px;color:#9ba39a;font-weight:400;margin-left:5px}.controls{padding:11px;background:white;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.filters,.right{display:flex;gap:7px;align-items:center}.search{position:relative}.search:before{content:'⌕';position:absolute;left:10px;top:5px;color:#8d978e;font-size:18px}.search input,.select{height:34px;border:1px solid #ebefea;border-radius:8px;background:#fafbf9;padding:0 9px;color:#59645b;font-size:11px;outline:0}.search input{width:210px;padding-left:30px}.views{display:flex;background:#f2f4f1;padding:3px;border-radius:8px}.views button{border:0;background:none;color:#7d877e;font-size:10px;padding:6px 9px;border-radius:6px}.views button.active{background:white;color:var(--green);font-weight:bold}.primary{background:var(--green);color:white;border:0;border-radius:8px;height:34px;padding:0 12px;font-size:11px;font-weight:650;white-space:nowrap}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.calhead{height:52px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.calhead strong{font-size:15px}.calhead small{color:#99a198;margin-left:8px}.actions{display:flex;gap:6px}.actions button{background:white;border:1px solid var(--line);border-radius:7px;color:#69746b;height:28px;padding:0 9px;font-size:10px}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{height:32px;background:#fcfdfb;border-bottom:1px solid var(--line)}.weekdays div{font-size:10px;color:#939d94;padding:8px}.grid{grid-auto-rows:minmax(100px,1fr)}.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;min-width:0;cursor:pointer}.day:nth-child(7n){border-right:0}.day:hover{background:#fbfcfa}.day.out{background:#fcfdfc;color:#b5bdb5}.day.today{background:#fbfdf8}.num{width:22px;height:22px;display:grid;place-items:center;font-size:10px;border-radius:50%;margin-bottom:5px;color:#58635a}.today .num{background:var(--green);color:white}.event{font-size:9px;padding:4px 5px;border-radius:4px;margin:3px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#edf3ec;color:#46654c;border-left:2px solid #7ca182}.event.high{background:#fbefeb;color:#a45c4d;border-color:#d47b65}.event.medium{background:#fbf5e8;color:#947133;border-color:#d6ad5a}.event.timed{background:#eaf1f7;color:#506b86;border-color:#7e9dbe}.event.done{text-decoration:line-through;opacity:.55}.board{padding:15px}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.column{background:#f8f9f7;border-radius:11px;padding:11px;min-height:320px}.colhead{font-size:12px;font-weight:650;margin-bottom:12px}.task{padding:10px;background:white;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer}.task b{font-size:11px}.task p{margin:7px 0 0;font-size:9px;color:#8b958c}.weekgrid{display:grid;grid-template-columns:45px repeat(7,minmax(70px,1fr));overflow:auto}.wh{padding:10px 3px;text-align:center;border-bottom:1px solid var(--line);font-size:10px;color:#7d897f}.wh b{display:block;font-size:15px}.hour,.cell{height:54px;border-bottom:1px solid #eff1ed;border-right:1px solid #eff1ed}.hour{font-size:9px;color:#9ba49b;padding:6px}.cell{cursor:pointer}.cell:hover{background:#fafcf9}.week-event{font-size:9px;margin:3px;padding:4px;background:#eaf1f7;border-radius:5px}.empty{text-align:center;color:#a1aaa1;padding:30px;font-size:11px}.modalbg{position:fixed;inset:0;background:#16231c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbg.open{display:flex}.modal{background:white;width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:16px;box-shadow:0 25px 80px #17251b44}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modalhead h2{font-size:17px;margin:0}.close{border:0;background:#f1f4f0;border-radius:7px;width:30px;height:30px}.form{padding:16px 20px 20px}.types{display:flex;gap:8px;margin-bottom:14px}.types button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fafbf9;color:#687369;font-size:11px}.types button.active{background:#eaf1eb;color:var(--green);border-color:#b9caba}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#69746a;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid #e7ece6;background:#fcfdfb;border-radius:7px;padding:8px;font-size:11px;outline:0}.field textarea{min-height:58px;resize:vertical}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{background:#f8f9f7;padding:6px;border-radius:6px;font-size:10px}.checks input{width:auto}.formfoot{display:flex;justify-content:space-between;margin-top:16px}.formfoot button{border-radius:7px;height:34px;padding:0 13px;font-size:11px}.cancel{background:white;border:1px solid var(--line)}.save{background:var(--green);color:white;border:0}.delete{border:0;background:none;color:#bf5e54}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#263c2d;color:white;padding:10px 15px;border-radius:9px;font-size:11px;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{padding:18px}.layout{grid-template-columns:175px 1fr;gap:15px}.search input{width:155px}.select{max-width:100px}.grid{grid-auto-rows:minmax(85px,1fr)}}@media(max-width:680px){.app{padding:14px 11px 70px}.layout{display:block}.sidebar{display:none}.greeting h1{font-size:21px}.date{max-width:120px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}.stat strong{font-size:21px}.controls{display:grid}.filters{display:grid;grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.search input{width:100%}.right{justify-content:space-between}.views{flex:1;justify-content:space-around}.views button{padding:6px 8px}.primary{padding:0 9px}.calhead{padding:0 9px}.calhead strong{font-size:13px}.actions button{padding:0 6px}.grid{grid-auto-rows:minmax(72px,1fr)}.day{padding:4px 2px}.weekdays div{text-align:center;padding:8px 0}.event{font-size:7px;padding:3px 2px}.columns{gap:6px}.column{padding:7px 5px}.task{padding:7px 5px}.task b{font-size:9px}.task p{font-size:8px}.mobile{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);height:58px;display:flex;align-items:center;justify-content:space-around;z-index:3}.mobile button{border:0;background:none;color:#778178;font-size:10px}.mobile button.active{color:var(--green)}.weekgrid{grid-template-columns:35px repeat(7,minmax(65px,1fr))}.form{padding:14px}.modalhead{padding:14px}}
</style><style>#authGate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.auth-card{width:min(420px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;text-align:center;box-shadow:0 16px 50px #25322912}.auth-card h1{font-size:23px;margin:12px 0 8px}.auth-card p{color:var(--muted);margin:0 0 22px}.auth-btn{height:44px;padding:0 18px;background:#fff;border:1px solid var(--line);border-radius:9px;font-weight:600;color:var(--ink)}.auth-msg{min-height:20px;margin-top:14px!important;font-size:12px;color:#a45c4d!important}.profile{display:flex;gap:10px;align-items:center}.profile button{border:0;background:#edf3ed;color:var(--green);border-radius:7px;padding:6px 9px}</style></head><body><section id="authGate"><div class="auth-card"><span class="mark">◷</span><h1>登入日常 Planner</h1><p>請使用 Google 帳號登入以查看你的行程與任務。</p><button class="auth-btn" id="googleLogin">使用 Google 帳號登入</button><p id="authMessage" class="auth-msg" role="status"></p></div></section><div class="app" id="plannerApp" hidden><header class="top"><div class="brand"><span class="mark">◷</span>日常 <span style="font-weight:400;color:#879087">/ PLANNER</span></div><div class="profile"><span id="userLabel">◉ 個人空間</span><button id="logout">登出</button></div></header><div class="layout"><aside class="sidebar"><div class="side-title">工作區</div><nav class="nav"><button class="active" data-view="month"><span>▦</span>月曆</button><button data-view="week"><span>▤</span>週／日曆</button><button data-view="board"><span>▥</span>任務看板</button></nav><div class="sidegroup"><div class="side-title">分類</div><div class="cat"><i class="dot"></i>工作</div><div class="cat"><i class="dot"></i>生活</div><div class="cat"><i class="dot"></i>學習</div><div class="cat"><i class="dot"></i>健康</div><div class="cat"><i class="dot"></i>其他</div></div><div class="linebox"><b>🟢 LINE 提醒</b><p>連結 LINE，接收重要期限提醒。</p><button id="line">設定 LINE 通知 ↗</button></div></aside><main class="main"><div class="greeting"><div><div class="eyebrow" id="eyebrow"></div><h1>讓每一天，<em>都更有序。</em></h1></div><div class="date"><b id="todayText"></b>把重要的事，安排在對的時間</div></div><section class="stats"><div class="stat"><label>今日待辦</label><strong id="sToday">0<small>項任務</small></strong></div><div class="stat"><label>即將到期</label><strong id="sSoon">0<small>項任務</small></strong></div><div class="stat"><label>尚未完成</label><strong id="sOpen">0<small>項任務</small></strong></div><div class="stat"><label>本月已完成</label><strong id="sDone">0<small>項任務</small></strong></div></section><section class="controls"><div class="filters"><div class="search"><input id="search" placeholder="搜尋任務或標籤…"></div><select id="statusFilter" class="select"><option value="">所有狀態</option><option>未開始</option><option>進行中</option><option>已完成</option></select><select id="catFilter" class="select"><option value="">所有分類</option><option>工作</option><option>生活</option><option>學習</option><option>健康</option><option>其他</option></select><select id="prioFilter" class="select"><option value="">所有優先度</option><option>高</option><option>中</option><option>低</option></select></div><div class="right"><div class="views"><button class="active" data-view="month">月</button><button data-view="week">週</button><button data-view="day">日</button><button data-view="board">看板</button></div><button id="add" class="primary">＋ 新增任務</button></div></section><section id="root"></section></main></div></div><nav class="mobile"><button class="active" data-view="month">▦ 月曆</button><button data-view="week">▤ 週／日</button><button data-view="board">▥ 看板</button><button id="addMobile">＋ 新增</button></nav>
<div class="modalbg" id="modalbg"><div class="modal"><div class="modalhead"><h2 id="modalTitle">新增任務</h2><button class="close" id="close">✕</button></div><form class="form" id="form"><input type="hidden" id="id"><div class="types"><button type="button" class="active" data-type="deadline">◷ 期限任務</button><button type="button" data-type="event">▤ 時段行程</button></div><div class="fields"><div class="field full"><label>任務名稱 *</label><input id="title" required maxlength="100" placeholder="例如：完成專案提案"></div><div class="field full"><label>詳細說明</label><textarea id="description" placeholder="補充任務細節…"></textarea></div><div class="field deadline"><label>截止日期 *</label><input type="date" id="date"></div><div class="field deadline"><label>截止時間（選填）</label><input type="time" id="time"></div><div class="field event" style="display:none"><label>開始日期 *</label><input type="date" id="startDate"></div><div class="field event" style="display:none"><label>開始時間 *</label><input type="time" id="startTime"></div><div class="field event" style="display:none"><label>結束日期 *</label><input type="date" id="endDate"></div><div class="field event" style="display:none"><label>結束時間 *</label><input type="time" id="endTime"></div><div class="field"><label>優先程度</label><select id="priority"><option>中</option><option>高</option><option>低</option></select></div><div class="field"><label>分類</label><select id="category"><option>工作</option><option>生活</option><option>學習</option><option>健康</option><option>其他</option></select></div><div class="field full"><label>標籤（以逗號分隔）</label><input id="tags" placeholder="提案, 客戶A"></div><div class="field"><label>任務狀態</label><select id="taskStatus"><option>未開始</option><option>進行中</option><option>已完成</option></select></div><div class="field"><label>提醒時間</label><select id="reminder"><option value="none">不提醒</option><option value="0">到期／開始時</option><option value="10">提前 10 分鐘</option><option value="30">提前 30 分鐘</option><option value="60">提前 1 小時</option><option value="1440">提前 1 天</option><option value="custom">自訂分鐘數</option></select></div><div class="field full" id="customWrap" style="display:none"><label>提前幾分鐘</label><input type="number" id="custom" min="1" max="525600" placeholder="45"></div><div class="field full"><label>提醒方式</label><div class="checks"><label><input type="checkbox" id="inApp" checked> 系統內提醒</label><label><input type="checkbox" id="lineCheck"> LINE 通知（需串接）</label></div></div><div class="field full"><label>重複</label><select id="repeat"><option value="none">不重複</option><option value="daily">每日</option><option value="weekly">每週</option><option value="monthly">每月</option></select></div><div class="field full" id="weekdays" style="display:none"><label>每週重複日（未選擇時沿用起始日星期）</label><div class="checks" id="weekdayChecks"></div></div><div class="field full" id="monthDayWrap" style="display:none"><label>每月日期</label><select id="monthDay"></select></div></div><div class="formfoot"><button type="button" class="delete" id="delete" style="visibility:hidden">刪除任務</button><div><button type="button" class="cancel" id="cancel">取消</button> <button type="submit" class="save">儲存任務</button></div></div></form></div></div><div id="toast" class="toast"></div>
<script src="firebase-config.js"></script><script src="app.js" defer></script><script type="module" src="auth.js"></script></body></html>
